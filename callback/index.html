<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Authorization complete — Jaca Social Publisher</title>
<style>
  body{font-family:-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;max-width:720px;margin:48px auto;padding:0 20px;color:#1f2d3d;line-height:1.55}
  h1{color:#5f8f00} code{background:#f4f7ee;padding:2px 6px;border-radius:5px;word-break:break-all}
  #c{background:#f4f7ee;border-radius:10px;padding:16px;margin-top:16px}
</style>
</head>
<body>
<h1>Authorization received</h1>
<p>You can close this tab. The authorization code below has been captured.</p>
<div id="c"><code id="code">reading...</code></div>
<script>
  const p = new URLSearchParams(location.search);
  document.getElementById('code').textContent =
    'code=' + (p.get('code')||'(none)') + '  state=' + (p.get('state')||'(none)') + (p.get('error')? '  error='+p.get('error') : '');
  document.title = 'Authorization complete';
</script>
</body>
</html>
